<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chorai iOS · 原稿与实际 App 对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#153b37;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:1220px;margin:auto;padding:32px 24px 20px}h1{font-size:29px;letter-spacing:-.7px;margin:8px 0}p{margin:5px 0;color:#586d64}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase}nav{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 14px}button,select{font:inherit;background:#fff;border:1px solid #d8ded5;border-radius:20px;padding:8px 15px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#153b37;color:white}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px}.note{margin-top:14px;max-width:850px;font-size:13px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1000px;margin:0 auto;padding:12px 24px 50px}.comparison.before{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1400px}figure{margin:0;min-width:0}figcaption{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:600}figcaption small{font-weight:400;color:#6c7c74}img{display:block;width:100%;height:auto;border:1px solid #dbe1d8;border-radius:25px;background:#eee}a{color:inherit}footer{border-top:1px solid #dbe1d8;max-width:1200px;margin:auto;padding:24px;color:#6c7c74;font-size:13px}.missing{min-height:350px;padding:50px;border:1px dashed #aaa;border-radius:20px}.dark{background:#242329;color:#bfdbcf}.dark p,.dark .note{color:#a2b5ac}.dark button,.dark select{background:#35363b;color:#bfdbcf;border-color:#515650}.dark button[aria-pressed=true]{background:#bfdbcf;color:#153b37}.dark img{border-color:#515650}@media(max-width:650px){header{padding:20px 16px}.comparison,.comparison.before{gap:10px;padding:10px 10px 28px}figcaption{font-size:12px;display:block}figcaption small{display:block}h1{font-size:24px}.comparison.before{grid-template-columns:repeat(2,minmax(0,1fr))}.comparison.before figure:last-child{grid-column:1/-1;max-width:50%;margin:auto}}</style>
<header><div class="eyebrow">CHORAI · NATIVE FIDELITY REVIEW</div><h1>原型确认稿，与当前原生 App</h1><p>同一屏幕尺寸、原始截图逐页对照。保留之前全部原型与首轮实现，不覆盖。</p><nav id="pages"></nav><div class="controls"><div><button id="light" aria-pressed="true">浅色</button> <button id="dark" aria-pressed="false">深色</button></div><label><input type="checkbox" id="before"> 同时查看首轮偏差稿</label></div><p class="note" id="note"></p></header><main class="comparison" id="comparison"></main><footer>当前 App 截图来自 iPhone 17 Pro / iOS 26.5，使用本地离线样本。样本用于核对视觉与点击流程；不代表账号登录、真实 AI 生成、收藏或服务器保存验证。点击图片可查看原尺寸。<br>长内容检查：<a href="screenshots/explore-long-top-light.png">浅色 · 顶部</a> / <a href="screenshots/explore-long-bottom-light.png">滚到底部</a> · <a href="screenshots/explore-long-top-dark.png">深色 · 顶部</a> / <a href="screenshots/explore-long-bottom-dark.png">滚到底部</a><br><a href="../FIDELITY-AUDIT.md">原稿依据与差异清单</a> · <a href="VALIDATION.md">本轮验证与边界</a></footer>
<script>
const base='../../2026-10-21-native-visual-reform/revisions/';
const pages=[
['home','Home','v6-feature-journeys/screenshots/home','home','恢复大标题、温白／深色纸面、开放式衬线笔记与 New note。My Notes / Collections 沿用真实 App 名称；日期、保存状态来自实际模型。'],
['editor','编辑器','v6-feature-journeys/screenshots/editor','editor','恢复整页衬线正文、居中 Note 与轻量元信息。保留真实单一正文编辑器和保存保护，菜单使用系统 Menu；并未新增标题输入。'],
['explore','Explore · 滑卡','v5-explore-grid/screenshots/flow','explore-cards','恢复原生顶部控件、卡片比例、带文字的 Spark 与 Previous。当前首张是同文的离线文字样本，未伪装成可加载的照片。'],
['grid','Explore · Grid','v8-grid-brush/screenshots/levels-grid','explore-grid','按 V8 恢复整卡限行摘要、等级、作者与操作同框，以及右上彩色笔触；Grid 隐藏 Chora。原稿在设计展示 sheet 中，真实 App 从 Explore 切换，保留真实导航。'],
['reader','阅读详情','v8-grid-brush/screenshots/levels-reader-basic','reader','详情保留等级、彩色笔触和 Chora；正文来自真实内容模型，已有作者、收藏与菜单操作保持可达。'],
['spark','Spark','v6-feature-journeys/screenshots/spark-results',null,'独立来源条、结果索引、阅读卡和 Continue Spark。当前截图用真实状态机与内存服务演示，不发起 AI 或后台请求。'],
['merge-selection','Merge · 选材','v6-feature-journeys/screenshots/merge-selection',null,'还原原稿选材层级与紧凑来源行，保留既有来源约束和真实操作语义。验证样本的笔记内容与原型不同。'],
['merge-result','Merge · 结果','v6-feature-journeys/screenshots/merge-ready',null,'还原整页 New Insight 与编辑正文、底部 Discard / Accept；截图是已有离线结果样本，不代表服务生成成功。']
];let current=pages[0],theme='light';
function figure(label,url,detail){let f=document.createElement('figure');let c=document.createElement('figcaption');c.textContent=label;let sm=document.createElement('small');sm.textContent=detail;c.append(sm);f.append(c);let a=document.createElement('a');a.href=url;a.target='_blank';let im=document.createElement('img');im.src=url;im.alt=label+' · '+current[1]+' · '+theme;im.onerror=()=>{im.remove();let d=document.createElement('div');d.className='missing';d.textContent='此状态没有对应实拍。请查看验证说明。';a.replaceWith(d)};a.append(im);f.append(a);return f}
function render(){document.body.classList.toggle('dark',theme==='dark');document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',pages[i]===current));for(let t of ['light','dark'])document.getElementById(t).setAttribute('aria-pressed',t===theme);document.getElementById('note').textContent=current[4];let area=document.getElementById('comparison');area.replaceChildren(figure('原型确认稿',base+current[2]+'-'+theme+'.png','V5 / V6 / V8'),figure('当前原生 App','screenshots/'+current[0]+'-'+theme+'.png','本轮实际运行截图'));let old=document.getElementById('before').checked&&current[3];area.classList.toggle('before',!!old);if(old)area.append(figure('首轮偏差稿','../screenshots/'+current[3]+'-'+theme+'.png','保留，仅作问题对照'));history.replaceState(null,'','#'+current[0]+'-'+theme)}
for(let item of pages){let b=document.createElement('button');b.textContent=item[1];b.onclick=()=>{current=item;render()};document.getElementById('pages').append(b)}for(let t of ['light','dark'])document.getElementById(t).onclick=()=>{theme=t;render()};document.getElementById('before').onchange=render;let match=location.hash.slice(1).match(/^(.*)-(light|dark)$/);if(match){current=pages.find(p=>p[0]===match[1])||pages[0];theme=match[2]}render();
</script></html>
